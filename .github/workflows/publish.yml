name: Owner npm Publication
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-osuite-publication
  cancel-in-progress: false
jobs:
  qualify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Require an exact version tag
        run: node -e 'if (process.env.GITHUB_REF_NAME !== `v${require("./sdk/package.json").version}`) process.exit(1)'
      - run: npm ci
      - run: npm run verify:source
      - run: npm test
      - run: npm run test:compat
      - run: npm run pack:sdk
  publish:
    needs: qualify
    environment: npm-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish only through configured npm trusted publishing
        working-directory: sdk
        run: npm publish --provenance --access public
