name: Authorized npm Publication
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full reviewed commit SHA on main
        type: string
        required: true
      expected_sha256:
        description: SHA-256 of the reviewed npm tarball
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: npm-osuite-publication
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Bind the release to the reviewed tag and source
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          deny() { echo "Release denied: $1" >&2; exit 1; }
          [[ "$GITHUB_RUN_ATTEMPT" == 1 && "$GITHUB_REF_TYPE" == tag ]] || deny 'not a first dispatch on a tag'
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ && "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || deny 'invalid commit or digest'
          [[ "$GITHUB_SHA" == "$EXPECTED_COMMIT" && "$(git rev-parse HEAD)" == "$EXPECTED_COMMIT" ]] || deny 'commit mismatch'
          version="$(node -p 'require("./sdk/package.json").version')"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || deny 'not a stable version'
          [[ "$GITHUB_REF" == "refs/tags/v$version" && "$(git rev-parse "$GITHUB_REF^{commit}")" == "$EXPECTED_COMMIT" ]] || deny 'version tag mismatch'
          git merge-base --is-ancestor "$EXPECTED_COMMIT" refs/remotes/origin/main
      - run: npm ci
      - run: npm run verify:source
      - run: node --test tests/release-authorization.test.mjs
      - run: npm test
      - run: npm run test:compat
      - run: npm run test:governed-tools
      - run: npm run pack:sdk
      - name: Verify the reviewed package bytes
        id: archive
        env:
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(output/*.tgz)
          [[ ${#archives[@]} == 1 && "${archives[0]}" == "output/osuite-${GITHUB_REF_NAME#v}.tgz" ]] || exit 1
          printf '%s  %s\n' "$EXPECTED_SHA256" "${archives[0]}" | shasum -a 256 --check --strict
          printf 'sha256=%s\n' "$EXPECTED_SHA256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualified-sdk
          path: output/osuite-*.tgz
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: qualify
    environment: npm-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/release-authorization.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check standing delegation or the independent environment review
        env:
          OSUITE_NPM_RELEASE_ACTOR_ID: ${{ vars.OSUITE_NPM_RELEASE_ACTOR_ID }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-authorization.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qualified-sdk
          path: ${{ runner.temp }}/qualified-sdk
      - name: Publish the previously qualified tarball through npm trusted publishing
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_SHA256: ${{ needs.qualify.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(qualified-sdk/*.tgz)
          [[ ${#archives[@]} == 1 && "${archives[0]}" == "qualified-sdk/osuite-${GITHUB_REF_NAME#v}.tgz" ]] || exit 1
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ && -f "${archives[0]}" && ! -L "${archives[0]}" ]] || exit 1
          tarball="$PWD/${archives[0]}"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$tarball" | shasum -a 256 --check --strict
          npm publish "$tarball" --provenance --access public --ignore-scripts --registry=https://registry.npmjs.org
